[package]
name = "iridium-pdf-engine"
description = "PDF engine façade: session, documents, command/tool catalogue"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
craft-docpath = { workspace = true }
iridium-pdf-measure = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
iridium-pdf-render = { workspace = true }
iridium-pdf-cos = { workspace = true }
iridium-pdf-organize = { workspace = true }
iridium-pdf-annot = { workspace = true }
iridium-pdf-forms = { workspace = true }
iridium-pdf-xfa = { workspace = true }
iridium-pdf-edit = { workspace = true }
iridium-pdf-content = { workspace = true }
iridium-pdf-audit = { workspace = true }
iridium-pdf-redact = { workspace = true }
iridium-pdf-print = { workspace = true }
iridium-pdf-xfdf = { workspace = true }
iridium-pdf-sign = { workspace = true }
iridium-pdf-optimize = { workspace = true }
iridium-pdf-a11y = { workspace = true }
iridium-pdf-ocr = { workspace = true }
iridium-pdf-js = { workspace = true }
iridium-pdf-compare = { workspace = true }
iridium-pdf-preflight = { workspace = true }
iridium-pdf-export = { workspace = true }
iridium-pdf-fonts = { workspace = true }
iridium-pdf-create = { workspace = true }
iridium-pdf-model = { workspace = true }
iridium-pdf-geom = { workspace = true }
thiserror = { workspace = true }
png = "0.18"
# Already in the graph (through image and iridium-pdf-create): image's TiffEncoder can't set the
# resolution or the compression of an exported page.
tiff = "0.11"
# Already in the graph (url and idna through webbrowser, icu_properties through boa): they show
# the host of a document's link the way the browser reads it (links::display_host).
url = "2.5"
idna = "1.1"
icu_properties = "2.3"
unicode-segmentation = "1.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Already in the graph through lopdf; used only for the local UTC offset ("today"). The workspace
# entry is std-only; this target adds `clock` for `chrono::Local::now`.
chrono = { workspace = true, features = ["clock"] }
getrandom = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
iridium-pdf-testkit = { workspace = true }
# JBIG2 fixtures (`encode_jbig2_generic`).
iridium-pdf-filters = { workspace = true }
