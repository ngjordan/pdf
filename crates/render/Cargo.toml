[package]
name = "iridium-pdf-render"
description = "Page rendering (bootstrap: hayro) and document inspection for PDF"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
iridium-pdf-cos = { workspace = true }
iridium-pdf-fonts = { workspace = true }
# The usable-quad rule `/QuadPoints` readers share.
iridium-pdf-geom = { workspace = true }
hayro ={ workspace = true }
hayro-syntax = { workspace = true }
# Picks the face of an installed font collection (the version iridium-pdf-fonts already uses).
skrifa = "0.47"
lopdf = { workspace = true }
kurbo = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# The reading-colours setting is persisted with the app state and echoed by the automation tool.
serde = { workspace = true }
# Reads rendered pixel words as bytes; already in the tree through hayro.
bytemuck = { version = "1" }
# Resolves relative URI actions against the catalog's /URI /Base, by the rules the browser uses;
# already in the tree (iridium-pdf-engine checks document links with it).
url = "2.5"
# Tells combining marks (bidi class NSM: general categories Mn and Me) in extracted text; the
# version iridium-pdf-fonts already uses.
unicode-bidi = "0.3"

# lopdf (bootstrap) draws random bytes for encryption; on the web they come from the browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
# The content crate's parser, compared operator by operator against hayro's in
# `tests/content_differential.rs` (L3 may depend on L2).
iridium-pdf-content = { workspace = true }
iridium-pdf-testkit = { workspace = true }
# Builds the decompression-bomb streams in the raster tests.
flate2 = { workspace = true }
