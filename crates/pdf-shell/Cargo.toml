[package]
name = "iridium-pdf-shell"
description = "The PDF app's shell as a library, hosted by the desktop app and the Office suite"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
iridium-pdf-ui-egui = { workspace = true }
# `owner_only`: the --control file is restricted to its user on Windows (#3922).
iridium-pdf-platform = { workspace = true }
eframe = { workspace = true, features = ["wgpu"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Whether the window is on Wayland (`native_wayland`). Already in the tree through winit and eframe.
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
# Settings ▸ Accessibility ▸ Visual effects ▸ Animation effects (src/motion.rs); same pin as the app.
windows = { version = "0.62", default-features = false, features = ["std", "UI_ViewManagement"] }
winit = { version = "0.30", default-features = false }
