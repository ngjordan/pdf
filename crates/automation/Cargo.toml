[package]
name = "iridium-pdf-automation"
description = "Agent control for PDF: a headless tool set over the engine and an MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
iridium-pdf-engine = { workspace = true }
iridium-pdf-cos = { workspace = true }
iridium-pdf-render = { workspace = true }
iridium-pdf-organize = { workspace = true }
iridium-pdf-platform = { workspace = true }
iridium-pdf-prc = { workspace = true }
iridium-pdf-prc-render = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
tempfile = "3.27"
base64 = { version = "0.23", optional = true }


[features]
default = ["mcp"]
# The MCP server module. Opt-in at run time either way; disable to leave it out of the build.
mcp = ["dep:base64"]

[dev-dependencies]
iridium-pdf-fonts = { workspace = true }
png = "0.18"
flate2.workspace = true
iridium-pdf-model = { workspace = true }
iridium-pdf-xfa = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
rustix = { version = "1", features = ["fs"] }
