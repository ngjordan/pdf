[package]
name = "iridium-pdf-ocr-worker"
description = "PDF in the browser: the Web Worker that recognises text (wasm32; trunk builds it with iridium-pdf-web)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
iridium-pdf-ocr = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["DedicatedWorkerGlobalScope", "MessageEvent"] }
